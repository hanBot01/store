<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Jojo Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="container nav-content">
            <a href="index.html" class="logo">JOJO <span>STORE</span> ADMIN</a>
            <div class="nav-actions">
                <a href="index.html">🏠 Kembali ke Toko</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="admin-panel">
            <h2 style="margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px;">Tambah Produk Baru</h2>
            <form onsubmit="addProduct(event)">
                <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                    <div class="form-group">
                        <label>Nama Produk</label>
                        <input type="text" id="p-name" placeholder="Contoh: Pterodactyl Panel 4GB" required>
                    </div>
                    <div class="form-group">
                        <label>Kategori</label>
                        <select id="p-type" required>
                            <option value="Pterodactyl">Pterodactyl Panel</option>
                            <option value="App">Aplikasi Premium</option>
                        </select>
                    </div>
                </div>

                <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                    <div class="form-group">
                        <label>Harga (Rp)</label>
                        <input type="number" id="p-price" placeholder="25000" required>
                    </div>
                    <div class="form-group">
                        <label>Stok / Slot</label>
                        <input type="number" id="p-stock" placeholder="100" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Spesifikasi (Opsional)</label>
                    <input type="text" id="p-specs" placeholder="Pisahkan dengan koma (Contoh: 4GB RAM, 200% CPU)">
                </div>

                <div class="form-group">
                    <label>URL Gambar</label>
                    <input type="url" id="p-image" placeholder="https://..." required>
                    <small style="color:#666; display:block; margin-top:5px;">Gunakan link gambar langsung</small>
                </div>

                <button type="submit" class="btn">+ Upload Produk</button>
            </form>

            <div class="table-wrap">
                <h3 style="margin: 30px 0 10px 0;">Daftar Produk Aktif</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Tipe</th>
                            <th>Nama</th>
                            <th>Spesifikasi</th>
                            <th>Stok</th>
                            <th>Harga</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="adminTable">
                        <tr><td colspan="6" style="text-align:center;">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // --- KONFIGURASI JSONBIN ---
        const BIN_ID = "6974d7fbd0ea881f408225a6"; 
        const X_MASTER_KEY = "$2a$10$bzkU1GyyqKF.i2CA0DCMjeVswtmX1HGeqnDEfsdg/nU2b6d17CtEW";

        let currentData = [];

        // Fungsi Ambil Data
        async function loadData() {
            const tbody = document.getElementById('adminTable');
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': X_MASTER_KEY }
                });
                const result = await response.json();
                currentData = result.record; 
                renderTable(currentData);
            } catch (error) {
                console.error(error);
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:red;">Gagal memuat data.</td></tr>`;
            }
        }

        // Fungsi Render Tabel
        function renderTable(data) {
            const tbody = document.getElementById('adminTable');
            tbody.innerHTML = '';
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:20px; color:#666;">Belum ada data produk.</td></tr>';
                return;
            }
            data.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td><span style="color:var(--primary); font-size:0.8rem; border:1px solid #333; padding:2px 5px;">${p.type}</span></td>
                        <td>${p.name}</td>
                        <td style="font-size:0.8rem; color:#aaa;">${p.specs || '-'}</td>
                        <td><input type="number" value="${p.stock}" style="width:60px; margin:0; padding:5px;" onchange="updateStock(${p.id}, this.value)"></td>
                        <td>Rp ${parseInt(p.price).toLocaleString('id-ID')}</td>
                        <td><button class="btn btn-danger" style="padding:5px 10px; font-size:0.7rem;" onclick="delProd(${p.id})">DEL</button></td>
                    </tr>
                `;
            });
        }

        // Fungsi Simpan Data ke Cloud (Update)
        async function saveData() {
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': X_MASTER_KEY
                    },
                    body: JSON.stringify(currentData)
                });
                console.log("Data tersimpan ke cloud!");
            } catch (error) {
                alert("Gagal menyimpan data: " + error);
            }
        }

        // Tambah Produk
        async function addProduct(e) {
            e.preventDefault();
            
            // Ambil data terbaru dulu sebelum tambah (untuk menghindari tumpang tindih)
            await loadData(); 

            const newProd = {
                id: Date.now(),
                name: document.getElementById('p-name').value,
                type: document.getElementById('p-type').value,
                price: parseInt(document.getElementById('p-price').value),
                stock: parseInt(document.getElementById('p-stock').value),
                specs: document.getElementById('p-specs').value,
                image: document.getElementById('p-image').value
            };

            currentData.push(newProd);
            await saveData(); // Simpan ke Cloud
            
            alert('Produk berhasil ditambahkan! Pelanggan sudah bisa melihatnya.');
            e.target.reset();
            loadData(); // Refresh tabel
        }

        // Update Stok
        async function updateStock(id, val) {
            const p = currentData.find(x => x.id === id);
            if(p) { 
                p.stock = parseInt(val); 
                await saveData(); // Simpan perubahan ke Cloud
            }
        }

        // Hapus Produk
        async function delProd(id) {
            if(confirm('Yakin ingin menghapus produk ini?')) {
                currentData = currentData.filter(x => x.id !== id);
                await saveData(); // Simpan ke Cloud
                loadData(); // Refresh tabel
            }
        }

        window.onload = loadData;
    </script>
</body>
</html>
