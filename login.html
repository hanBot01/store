<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - KASIRKITA</title>
    <!-- Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f1f5f9;
            --surface: #ffffff;
            --text: #1e293b;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: var(--text);
        }
        .login-card {
            background: var(--surface);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .brand {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover { background-color: #1d4ed8; }
        .link {
            display: block;
            margin-top: 1rem;
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .error { color: #ef4444; font-size: 0.9rem; margin-bottom: 1rem; display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand"><i class="ph ph-storefront"></i> KASIRKITA</div>
        <p style="color: #64748b;">Silakan masuk untuk melanjutkan</p>
        <br>
        <div id="error-msg" class="error">Username atau password salah</div>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Masuk</button>
        </form>
        <a href="register.html" class="link">Belum punya akun? Daftar</a>
    </div>

    <script>
        // LOGIKA LOGIN (Tanpa file JS terpisah)
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            // Ambil data user dari LocalStorage
            const users = JSON.parse(localStorage.getItem('kkr_users')) || [];
            const user = users.find(user => user.username === u && user.password === p);

            if (user) {
                // Simpan sesi login
                localStorage.setItem('kkr_current_user', JSON.stringify(user));
                window.location.href = 'index.html'; // Redirect ke Dashboard
            } else {
                const err = document.getElementById('error-msg');
                err.style.display = 'block';
                err.textContent = 'Username atau password salah!';
            }
        });

        // Cek apakah sudah login sebelumnya
        if (localStorage.getItem('kkr_current_user')) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
