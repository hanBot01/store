<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - KASIRKITA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* Sama dengan login.css agar konsisten */
        :root { --primary: #2563eb; --bg: #f1f5f9; --surface: #ffffff; --text: #1e293b; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: var(--text); }
        .login-card { background: var(--surface); padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); width: 100%; max-width: 400px; text-align: center; }
        .brand { font-size: 2rem; font-weight: 800; color: var(--primary); margin-bottom: 0.5rem; display: flex; align-items: center; justify-content: center; gap: 10px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; font-family: inherit; }
        button { width: 100%; padding: 12px; background-color: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 1rem; }
        button:hover { background-color: #1d4ed8; }
        .link { display: block; margin-top: 1rem; color: var(--primary); text-decoration: none; font-size: 0.9rem; }
        .success { color: #10b981; font-size: 0.9rem; margin-bottom: 1rem; display: none; }
        .error { color: #ef4444; font-size: 0.9rem; margin-bottom: 1rem; display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand"><i class="ph ph-storefront"></i> KASIRKITA</div>
        <p style="color: #64748b;">Buat akun admin baru</p>
        <br>
        <div id="status-msg"></div>
        <form id="registerForm">
            <input type="text" id="reg-username" placeholder="Username Baru" required>
            <input type="password" id="reg-password" placeholder="Password Baru" required>
            <button type="submit">Daftar Akun</button>
        </form>
        <a href="login.html" class="link">Sudah punya akun? Login</a>
    </div>

    <script>
        // LOGIKA REGISTER (Tanpa file JS terpisah)
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const u = document.getElementById('reg-username').value;
            const p = document.getElementById('reg-password').value;
            const msg = document.getElementById('status-msg');

            // Ambil user lama
            let users = JSON.parse(localStorage.getItem('kkr_users')) || [];
            
            // Cek jika username sudah ada
            if (users.find(user => user.username === u)) {
                msg.className = 'error';
                msg.style.display = 'block';
                msg.textContent = 'Username sudah dipakai!';
                return;
            }

            // Tambah user baru
            users.push({ username: u, password: p });
            localStorage.setItem('kkr_users', JSON.stringify(users));

            msg.className = 'success';
            msg.style.display = 'block';
            msg.textContent = 'Registrasi berhasil! Silakan login.';
            
            // Kosongkan form
            document.getElementById('registerForm').reset();

            // Redirect otomatis setelah 1.5 detik
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500);
        });
    </script>
</body>
</html>
